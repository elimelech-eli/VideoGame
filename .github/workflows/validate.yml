name: Validate
on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    outputs:
      run_unity: ${{ steps.scope.outputs.run_unity }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select validation scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_BEFORE: ${{ github.event.before }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci_scope.py
      - name: Check validation tooling
        run: python3 -m unittest discover -s Tests/CI -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project Tests/CoreChecks/CoreChecks.csproj --configuration Release
      - name: Whitespace check
        run: git show --format= --check HEAD -- '*.cs' '*.md' '*.yml' '*.ps1' '*.py' '*.json' '*.asmdef'
  unity:
    name: Unity tests
    needs: core
    if: needs.core.outputs.run_unity == 'true'
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache Unity imports
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-${{ runner.os }}-Windows64-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-${{ hashFiles('Assets/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unity-${{ runner.os }}-Windows64-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-
      - name: Require Unity license configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo '::error::Configure UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets. See docs/DEVELOPMENT.md. Unity tests have not run.'
            exit 1
          fi
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: all
          customParameters: -nographics
          artifactsPath: artifacts/unity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: artifacts/unity
          if-no-files-found: ignore
      - name: Build Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildMethod: VideoGame.Editor.ProjectSetup.BuildWindows
          versioning: None
      - uses: actions/upload-artifact@v4
        with:
          name: windows-player
          path: Builds/Windows
          if-no-files-found: error
  player-smoke:
    name: Windows player smoke test
    needs: unity
    if: needs.unity.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-player
          path: Builds/Windows
      - name: Launch built player and check initialization
        shell: pwsh
        run: ./scripts/Test-Player.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-player-log
          path: TestResults/Player.log
